<!DOCTYPE html>
<html lang="ja">
<head>

      background-color: #f4f6f8;
      color: #222;
      line-height: 1.7;
    }
    .container {
      max-width: 720px;
      margin: 48px auto;
      padding: 32px;
      background: #fff;
      border: 1px solid #e0e5eb;
      border-radius: 8px;
      box-sizing: border-box;

      margin-top: 0;
      font-size: 1.35rem;

      padding-bottom: 10px;

      background: #f9fafb;
      border-left: 4px solid #1f4e78;
      padding: 14px 16px;
      margin: 20px 0;
    }
    .note {
      font-size: 0.9rem;
      color: #555;
    }

<body>
  <div class="container">
    <h1>弊社ホームページ一時停止のお知らせ</h1>

      現在、委託先サーバーの障害（不正アクセス事案）に伴い、弊社ホームページを一時停止しております。
    </p>
    <div class="box">
      <strong>現在の状況</strong><br>
      現在、状況確認および復旧対応を進めております。最新の状況やお問い合わせ先については、追ってお知らせいたします。
